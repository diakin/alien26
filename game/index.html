<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>alien26 — прототип перемещения</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141a12; font-family: Arial, Helvetica, sans-serif; }
  #view { display: block; cursor: crosshair; }
  .panel { position: absolute; background: rgba(10, 13, 15, 0.78); border: 1px solid #39444a; color: #d9e2e6; font-size: 12px; line-height: 1.55; padding: 8px 12px; }
  #help { left: 12px; top: 12px; }
  #help b, #hud b { color: #ffd23a; font-weight: bold; }
  #hud { left: 12px; bottom: 12px; font-size: 14px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="help" class="panel">
  <b>ЛКМ</b> по бойцу — выбрать · <b>ЛКМ</b> по клетке — идти · <b>ПКМ</b> щелчком — повернуться в сторону курсора<br>
  <b>ПКМ / колесо</b> с протяжкой или <b>стрелки / WASD</b> — прокрутка · <b>Esc</b> — снять выбор<br>
  <b>Пробел</b> — следующий боец · <b>G</b> — сетка вкл/выкл
</div>
<div id="hud" class="panel"></div>
<script src="js/data.js"></script>
<script src="js/iso.js"></script>
<script src="js/path.js"></script>
<script src="js/game.js"></script>
</body>
</html>
