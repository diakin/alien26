<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Рендер музыки</title></head>
<body>
<script src="../../game/js/music.js"></script>
<script>
// Рендер темы в WAV (16 бит, стерео) и передача в base64: window.renderTheme('calm', 32)
function encodeWav(buffer) {
  var channels = buffer.numberOfChannels, length = buffer.length, rate = buffer.sampleRate;
  var bytes = new DataView(new ArrayBuffer(44 + length * channels * 2));
  function text(offset, value) { for (var index = 0; index < value.length; index++) bytes.setUint8(offset + index, value.charCodeAt(index)); }
  text(0, 'RIFF'); bytes.setUint32(4, 36 + length * channels * 2, true); text(8, 'WAVE'); text(12, 'fmt ');
  bytes.setUint32(16, 16, true); bytes.setUint16(20, 1, true); bytes.setUint16(22, channels, true);
  bytes.setUint32(24, rate, true); bytes.setUint32(28, rate * channels * 2, true); bytes.setUint16(32, channels * 2, true);
  bytes.setUint16(34, 16, true); text(36, 'data'); bytes.setUint32(40, length * channels * 2, true);
  var data = []; for (var channel = 0; channel < channels; channel++) data.push(buffer.getChannelData(channel));
  var offset = 44, peak = 0;
  for (var sample = 0; sample < length; sample++) {
    for (channel = 0; channel < channels; channel++) {
      var value = data[channel][sample];
      if (value !== value) value = 0;
      peak = Math.max(peak, Math.abs(value));
      value = Math.max(-1, Math.min(1, value));
      bytes.setInt16(offset, value * 32767, true); offset += 2;
    }
  }
  var binary = '', array = new Uint8Array(bytes.buffer);
  for (var start = 0; start < array.length; start += 32768) binary += String.fromCharCode.apply(null, array.subarray(start, start + 32768));
  return { wav: btoa(binary), peak: peak };
}
window.renderTheme = function (name, bars, solo) {
  return Music.renderOffline(name, bars, 44100, solo).then(encodeWav);
};
</script>
</body></html>
